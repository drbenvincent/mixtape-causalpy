[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mixtape-causalpy"
version = "0.1.0"
description = "Unofficial CausalPy translations of code examples from Causal Inference: The Mixtape (Yale University Press, 2021). Not affiliated with the author or the publisher."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
  { name = "Benjamin Vincent" },
]
dependencies = [
    "causalpy>=1.0.0rc1,<2",
    "pymc>=6.0.1,<7",
    "arviz>=1.1,<2",
    "pandas>=2.3,<4",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "plotnine>=0.15.7",
    "ipykernel>=6",
    "nbclient>=0.10",
    "nbformat>=5",
    "pyyaml>=6",
]

[project.urls]
"Mixtape Book (1st ed.)" = "https://mixtape-1ed.netlify.app/"
"CausalPy" = "https://causalpy.readthedocs.io"
"Repository" = "https://github.com/drbenvincent/mixtape-causalpy"

[tool.setuptools.packages.find]
where = ["src"]

