[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mixtape-causalpy"
version = "0.1.0"
description = "CausalPy implementations of Causal Inference: The Mixtape examples"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "causalpy>=1.0.0rc1,<2",
    "pymc>=6.0.1,<7",
    "arviz>=1.1,<2",
    "pandas>=2.3,<4",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "plotnine>=0.15.7",
    "ipykernel>=6",
    "nbclient>=0.10",
    "nbformat>=5",
    "pyyaml>=6",
]

[project.urls]
"Mixtape Book" = "https://mixtape.scunning.com"
"CausalPy" = "https://causalpy.readthedocs.io"
"Repository" = "https://github.com/pymc-labs/CausalPy"

[tool.setuptools.packages.find]
where = ["src"]

