on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Quarto resolves `jupyter: mixtape-causalpy` before freeze can skip
      # execution. The name only has to exist; committed `_freeze/` is what renders.
      - name: Register freeze kernel name
        run: |
          python3 -m pip install --user --break-system-packages ipykernel
          python3 -m ipykernel install --user --name mixtape-causalpy --display-name "Mixtape CausalPy"

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
