project:
  type: website
  render:
    - index.qmd
    - notebooks/*.qmd

website:
  title: "The Mixtape in CausalPy"
  description: "CausalPy implementations of Causal Inference: The Mixtape"
  site-url: https://drbenvincent.github.io/mixtape-causalpy/
  repo-url: https://github.com/drbenvincent/mixtape-causalpy
  repo-actions: [source, issue]
  page-navigation: true
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Mixtape
        href: https://mixtape.scunning.com
      - text: CausalPy
        href: https://causalpy.readthedocs.io
  sidebar:
    style: docked
    search: true
    contents:
      - section: Chapters
        contents:
          - notebooks/05_matching.qmd
          - notebooks/06_regression_discontinuity.qmd
          - notebooks/07_instrumental_variables.qmd
          - notebooks/08_panel_data.qmd
          - notebooks/09_difference_in_differences.qmd
          - notebooks/10_synthetic_control.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-overflow: wrap

execute:
  freeze: auto

jupyter: mixtape-causalpy
