project:
  type: website
  render:
    - index.qmd
    - attribution.qmd
    - notebooks/*.qmd

website:
  title: "The Mixtape in CausalPy"
  description: "Unofficial CausalPy translations of the code examples from Scott Cunningham, Causal Inference: The Mixtape (Yale University Press, 2021). Not affiliated with the author or the publisher."
  site-url: https://drbenvincent.github.io/mixtape-causalpy/
  repo-url: https://github.com/drbenvincent/mixtape-causalpy
  repo-actions: [source, issue]
  page-navigation: true
  search: true
  navbar:
    left:
      - href: index.qmd
        text: Home
      - text: Attribution
        href: attribution.qmd
      - text: "Mixtape (1st ed.)"
        href: https://mixtape-1ed.netlify.app/
      - text: CausalPy
        href: https://causalpy.readthedocs.io
    right:
      - text: Benjamin T. Vincent
        href: https://drbenvincent.github.io/
  page-footer:
    left: "Unofficial. Not affiliated with Scott Cunningham or Yale University Press."
    right:
      - text: Attribution
        href: attribution.qmd
  sidebar:
    style: docked
    search: true
    contents:
      - section: Chapters
        contents:
          - notebooks/05_matching.qmd
          - notebooks/06_regression_discontinuity.qmd
          - notebooks/07_instrumental_variables.qmd
          - notebooks/09_difference_in_differences.qmd
          - notebooks/10_synthetic_control.qmd

format:
  html:
    theme: cosmo
    toc: true
    code-copy: true
    code-overflow: wrap
    open-graph: true
    twitter-card: true

execute:
  freeze: auto

jupyter: mixtape-causalpy
